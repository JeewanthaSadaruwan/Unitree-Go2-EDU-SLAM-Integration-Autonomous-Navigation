slam_toolbox:
  ros__parameters:
    # =========================
    # TIME
    # =========================
    use_sim_time: false

    # =========================
    # FRAMES (must match your TF tree)
    # Required TF chain:
    #   odom -> base_link   (from your odometry source)
    # slam_toolbox publishes:
    #   map  -> odom
    # =========================
    base_frame: base_link
    odom_frame: odom
    map_frame: map

    # =========================
    # INPUT SCAN
    # =========================
    scan_topic: /scan
    scan_queue_size: 10

    # =========================
    # MODE
    # mapping: build a map
    # localization: localize against an existing map
    # =========================
    mode: mapping

    # =========================
    # SOLVER
    # =========================
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # =========================
    # SCAN MATCHING (stability-focused)
    # =========================
    use_scan_matching: true
    use_scan_barycenter: false

    # Process updates more frequently (helps legged robots)
    minimum_travel_distance: 0.08        # 8 cm
    minimum_travel_heading: 0.10         # ~5.7 deg

    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 15.0

    link_scan_maximum_distance: 1.5
    link_match_minimum_response_fine: 0.10

    # =========================
    # LOOP CLOSURE (tighter to reduce snaps)
    # =========================
    do_loop_closing: true
    loop_search_maximum_distance: 2.0
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    # =========================
    # CORRELATION
    # =========================
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # =========================
    # LOOP SEARCH SPACE
    # =========================
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # =========================
    # SCAN MATCHER COSTS
    # =========================
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349

    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # =========================
    # MAP
    # =========================
    resolution: 0.05
    max_laser_range: 30.0

    minimum_time_interval: 0.5
    map_update_interval: 1.0
    transform_publish_period: 0.02       # 50 Hz

    enable_interactive_mode: true

    # =========================
    # TF / TIMING ROBUSTNESS
    # (helps when network jitter changes with Ethernet/Wi-Fi)
    # =========================
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # =========================
    # OPTIMIZATION
    # =========================
    optimization_iterations: 5
    max_iterations_to_solve: 100

    # =========================
    # CPU THROTTLE
    # =========================
    throttle_scans: 1

    # =========================
    # DEBUG
    # =========================
    debug_logging: false