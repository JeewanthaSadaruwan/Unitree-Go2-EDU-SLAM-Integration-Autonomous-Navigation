slam_toolbox:
  ros__parameters:
    # ========== ROBOT & FRAMES ==========
    use_sim_time: false
    base_frame: base_link
    odom_frame: odom
    map_frame: map

    # ========== SCAN SETTINGS ==========
    # Use the scan produced by pointcloud_to_laserscan
    scan_topic: /scan_raw
    scan_queue_size: 10

    # ========== MODE ==========
    mode: mapping  # mapping or localization

    # ========== SOLVER ==========
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ========== SCAN MATCHING ==========
    use_scan_matching: true
    # Barycenter sometimes makes walls “fatter” depending on scan characteristics
    use_scan_barycenter: false

    # Process only after meaningful motion (reduces repainting noise on legged robots)
    minimum_travel_distance: 0.30        # meters
    minimum_travel_heading: 0.30         # radians (~17 deg)

    scan_buffer_size: 20

    # Keep scan matching focused on near/mid returns (better indoors)
    scan_buffer_maximum_scan_distance: 12.0
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 2.0

    link_match_minimum_response_fine: 0.1

    # ========== LOOP CLOSING ==========
    do_loop_closing: true
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    # ========== CORRELATION ==========
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # ========== LOOP CLOSURE SEARCH ==========
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.01
    loop_search_space_smear_deviation: 0.03

    # ========== SCAN MATCHER ==========
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # ========== MAP SETTINGS ==========
    resolution: 0.05                     # 5cm per grid cell
    # Match this with pointcloud_to_laserscan range_max for consistency
    max_laser_range: 12.0

    minimum_time_interval: 0.5
    transform_publish_period: 0.02       # 50Hz TF publishing
    map_update_interval: 1.0             # 1 Hz map updates
    enable_interactive_mode: true

    # ========== TIMING & TRANSFORMS ==========
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000          # 40MB stack

    # ========== OPTIMIZER SETTINGS ==========
    optimization_iterations: 5
    max_iterations_to_solve: 100

    # ========== THROTTLE (reduce CPU load + reduce smear if TF is late) ==========
    throttle_scans: 2                    # process every 2nd scan

    # ========== DEBUG ==========
    debug_logging: false
