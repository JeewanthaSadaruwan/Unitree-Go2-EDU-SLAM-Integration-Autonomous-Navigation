# ============================================================================
# Nav2 Configuration for Unitree Go2 Robot (Foxy)
# Tuned for stable / forgiving navigation (near-goal acceptable)
# ============================================================================

# ============================================================================
# AMCL - Adaptive Monte Carlo Localization
# ============================================================================
amcl:
  ros__parameters:
    use_sim_time: false

    # Frame IDs
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    # Sensor configuration
    scan_topic: "/scan"

    # TF
    tf_broadcast: true
    transform_tolerance: 0.5   # Helps with small TF delays on real robot/network

    # Initialization
    set_initial_pose: false
    save_pose_rate: 0.5        # Save estimated pose periodically (Hz)

    # Particle filter size
    min_particles: 300         # Slightly higher minimum for better robustness
    max_particles: 2500

    # Particle filter convergence params
    pf_err: 0.05
    pf_z: 0.99

    # Update cadence (avoid over-updating on tiny motion)
    update_min_d: 0.10         # meters before filter update
    update_min_a: 0.10         # radians before filter update
    resample_interval: 1

    # Recovery from localization degradation
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Odometry model noise (tune later if needed)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Laser model
    laser_model_type: "likelihood_field"
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0      # set close to actual /scan max range if known
    laser_min_range: 0.05

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.4                # slightly lower random than before
    sigma_hit: 0.2
    lambda_short: 0.1

    # Beam skipping (Foxy support may vary by build; keep commented if unsupported)
    # do_beamskip: false
    # beam_skip_distance: 0.5
    # beam_skip_threshold: 0.3
    # beam_skip_error_threshold: 0.9

# ============================================================================
# MAP SERVER
# ============================================================================
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/unitree/SLAM/maps/floor10.yaml"

# ============================================================================
# CONTROLLER SERVER
# ============================================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: "/utlidar/robot_odom"
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # More forgiving stuck detection (reduces false recoveries while rotating/re-aligning)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    # Near-goal is acceptable (reduces final twitching)
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.45
      yaw_goal_tolerance: 0.60
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      # Velocity limits (conservative for stability)
      min_vel_x: 0.0
      max_vel_x: 0.25
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.7          # slightly reduced to reduce aggressive spinning
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0

      # Acceleration limits
      acc_lim_x: 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 1.2          # slightly smoother rotation accel
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -1.2

      # Trajectory sampling
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 16          # reduced from 20 to reduce twitchiness + CPU
      sim_time: 1.3               # slightly shorter simulation horizon

      # Sampling resolution
      linear_granularity: 0.05
      angular_granularity: 0.04   # coarser angular granularity can reduce jitter

      transform_tolerance: 0.2
      xy_goal_tolerance: 0.45
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      # Critic weights (slightly less aggressive alignment/rotation near goal)
      BaseObstacle.scale: 0.03
      PathAlign.scale: 24.0
      GoalAlign.scale: 16.0
      PathDist.scale: 28.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 6.0
      RotateToGoal.lookahead_time: -1.0

# ============================================================================
# PLANNER SERVER
# ============================================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# ============================================================================
# RECOVERIES SERVER
# ============================================================================
recoveries_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: /local_costmap/costmap_raw
    footprint_topic: /local_costmap/published_footprint
    cycle_frequency: 5.0
    recovery_plugins: ["spin", "backup", "wait"]

    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"

# ============================================================================
# BT NAVIGATOR
# ============================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/utlidar/robot_odom"

    default_bt_xml_filename: "/opt/ros/foxy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

# ============================================================================
# WAYPOINT FOLLOWER
# ============================================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false

# ============================================================================
# GLOBAL COSTMAP
# ============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: map
      robot_base_frame: base_link

      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      always_send_full_costmap: true

      resolution: 0.05
      track_unknown_space: true
      rolling_window: false

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50    # slightly reduced from 0.55 for easier passage
        cost_scaling_factor: 3.0

# ============================================================================
# LOCAL COSTMAP
# ============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.5
      always_send_full_costmap: true

      rolling_window: true
      width: 4                    # increased from 3 for better local context
      height: 4                   # increased from 3 for better local context
      resolution: 0.05

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45    # slightly reduced to reduce local blockage behavior
        cost_scaling_factor: 3.0
